name: Build and Push Container Image to GitHub Container Registry

on:
    push:
        branches:
            - master

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate lowercase image name
              id: vars
              run: |
                  IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/platzi-download:latest"
                  echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

            - name: Build & Push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ steps.vars.outputs.image_name }}

            - name: Verify image pulls correctly
              run: docker run --rm ${{ steps.vars.outputs.image_name }} python --version